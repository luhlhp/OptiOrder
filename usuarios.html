<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiOrder - Cadastro de Usuários</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; }
        h2 { color: #333; margin-bottom: 20px; text-align: center; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 20px; }
        button:hover { background-color: #0056b3; }
        .mensagem { margin-top: 15px; font-weight: bold; text-align: center; }
        .sucesso { color: green; }
        .erro { color: red; }
        .voltar { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cadastro de Usuário 👤</h2>
        <form id="formUsuario">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" autocomplete="name" required placeholder="Digite o nome">

            <label for="email">E-mail:</label>
            <input type="email" id="email" autocomplete="email" required placeholder="exemplo@email.com">

            <label for="senha">Senha:</label>
            <input type="password" id="senha" autocomplete="new-password" required placeholder="Digite a senha">

            <button type="submit">Cadastrar Usuário</button>
        </form>

        <p id="mensagem" class="mensagem"></p>
        <a href="index.html" class="voltar">← Voltar para o Login</a>
    </div>

    <script>
        document.getElementById('formUsuario').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const msg = document.getElementById('mensagem');

            msg.innerText = "Cadastrando...";
            msg.className = "mensagem";

            try {
                const response = await fetch('http://127.0.0.1:8000/usuarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha })
                });

                const data = await response.json();

                if (response.ok) {
                    msg.innerText = "Usuário cadastrado com sucesso!";
                    msg.className = "mensagem sucesso";
                    document.getElementById('formUsuario').reset();
                } else {
                    msg.innerText = data.detail || "Erro ao cadastrar usuário.";
                    msg.className = "mensagem erro";
                }
            } catch (err) {
                msg.innerText = "Erro ao conectar com o servidor Python.";
                msg.className = "mensagem erro";
            }
        });
    </script>

</body>
</html>
