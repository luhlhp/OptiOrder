<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Pedidos - OptiOrder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .badge-pendente { background-color: #ffc107; color: #000; }
        .badge-processamento { background-color: #0d6efd; }
        .badge-enviado { background-color: #0dcaf0; color: #000; }
        .badge-entregue { background-color: #198754; }
        .badge-cancelado { background-color: #dc3545; }
    </style>
</head>
<body class="bg-light">

    <div class="container my-4">
        <!-- BOTÃO VOLTAR -->
        <div class="mb-3">
            <a href="dashboard.html" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Voltar ao Menu
            </a>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-box-seam"></i> Gestão de Pedidos</h2>
            <button class="btn btn-outline-secondary" onclick="carregarPedidos()">
                <i class="bi bi-arrow-clockwise"></i> Atualizar
            </button>
            <button class="btn btn-success" onclick="exportarCSV()">
                <i class="bi bi-file-earmark-excel"></i> Exportar Excel (CSV)
            </button>
        </div>

        <!-- PAINEL DE FILTROS -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3"><i class="bi bi-funnel"></i> Filtros de Busca</h5>
                <form id="formFiltros" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Buscar (Nº Pedido / Ótica)</label>
                        <input type="text" id="filtroBusca" class="form-control" placeholder="Ex: ORD-171 ou Ótica">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Status</label>
                        <select id="filtroStatus" class="form-select">
                            <option value="">Todos</option>
                            <option value="Pendente">Pendente</option>
                            <option value="Em Processamento">Em Processamento</option>
                            <option value="Enviado">Enviado</option>
                            <option value="Entregue">Entregue</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Ótica</label>
                        <select id="filtroOtica" class="form-select">
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Data Início</label>
                        <input type="date" id="filtroDataInicio" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Data Fim</label>
                        <input type="date" id="filtroDataFim" class="form-control">
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="button" class="btn btn-primary w-100" onclick="carregarPedidos()">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- TABELA DE PEDIDOS -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Nº Pedido</th>
                                <th>Ótica</th>
                                <th>Data</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaPedidos">
                            <tr>
                                <td colspan="6" class="text-center">Carregando pedidos...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE ITENS DO PEDIDO -->
    <div class="modal fade" id="modalItens" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Itens do Pedido <span id="modalPedidoNumero"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Modelo</th>
                                <th>Marca</th>
                                <th>Qtd</th>
                                <th>Preço Unit.</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaItensModal"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL ALTERAR STATUS -->
    <div class="modal fade" id="modalStatus" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Alterar Status do Pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="pedidoIdStatus">
                    <div class="mb-3">
                        <label class="form-label">Novo Status:</label>
                        <select id="selectNovoStatus" class="form-select">
                            <option value="Pendente">Pendente</option>
                            <option value="Em Processamento">Em Processamento</option>
                            <option value="Enviado">Enviado</option>
                            <option value="Entregue">Entregue</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="salvarNovoStatus()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL HISTÓRICO -->
    <div class="modal fade" id="modalHistorico" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Histórico de Alterações</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul class="list-group" id="listaHistorico"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = "http://127.0.0.1:8000";

        document.addEventListener("DOMContentLoaded", () => {
            carregarOticasFiltro();
            carregarPedidos();
        });

        // Carrega as óticas para popular o select de filtro
        async function carregarOticasFiltro() {
            try {
                const res = await fetch(`${API_URL}/oticas`);
                const oticas = await res.json();
                const select = document.getElementById("filtroOtica");
                oticas.forEach(o => {
                    select.innerHTML += `<option value="${o.id}">${o.nome}</option>`;
                });
            } catch (err) {
                console.error("Erro ao carregar óticas:", err);
            }
        }

        // Buscar lista de pedidos aplicando os filtros selecionados
        async function carregarPedidos() {
            const busca = document.getElementById("filtroBusca").value;
            const status = document.getElementById("filtroStatus").value;
            const oticaId = document.getElementById("filtroOtica").value;
            const dataInicio = document.getElementById("filtroDataInicio").value;
            const dataFim = document.getElementById("filtroDataFim").value;

            let url = `${API_URL}/pedidos?`;
            if (busca) url += `busca=${encodeURIComponent(busca)}&`;
            if (status) url += `status=${encodeURIComponent(status)}&`;
            if (oticaId) url += `otica_id=${oticaId}&`;
            if (dataInicio) url += `data_inicio=${dataInicio}&`;
            if (dataFim) url += `data_fim=${dataFim}&`;

            try {
                const res = await fetch(url);
                const pedidos = await res.json();
                const tbody = document.getElementById("tabelaPedidos");
                tbody.innerHTML = "";

                if (pedidos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Nenhum pedido encontrado.</td></tr>';
                    return;
                }

                pedidos.forEach(p => {
                    const statusClass = getBadgeClass(p.status);
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${p.numero_pedido}</strong></td>
                            <td>${p.otica_nome}</td>
                            <td>${p.data_formatada}</td>
                            <td>R$ ${parseFloat(p.valor_total).toFixed(2)}</td>
                            <td><span class="badge ${statusClass}">${p.status || 'Pendente'}</span></td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-info me-1" title="Ver Itens" onclick="verItens(${p.id}, '${p.numero_pedido}')">
                                    <i class="bi bi-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-warning me-1" title="Alterar Status" onclick="abrirModalStatus(${p.id}, '${p.status || 'Pendente'}')">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-secondary" title="Histórico" onclick="verHistorico(${p.id})">
                                    <i class="bi bi-clock-history"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Erro ao carregar pedidos:", err);
            }
        }

        function getBadgeClass(status) {
            switch (status) {
                case 'Em Processamento': return 'badge-processamento';
                case 'Enviado': return 'badge-enviado';
                case 'Entregue': return 'badge-entregue';
                case 'Cancelado': return 'badge-cancelado';
                default: return 'badge-pendente';
            }
        }

        // Ver Itens
        async function verItens(pedidoId, numeroPedido) {
            document.getElementById("modalPedidoNumero").innerText = `#${numeroPedido}`;
            try {
                const res = await fetch(`${API_URL}/pedidos/${pedidoId}/itens`);
                const itens = await res.json();
                const tbody = document.getElementById("tabelaItensModal");
                tbody.innerHTML = "";

                itens.forEach(i => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${i.modelo}</td>
                            <td>${i.marca || '-'}</td>
                            <td>${i.quantidade}</td>
                            <td>R$ ${parseFloat(i.preco_unitario).toFixed(2)}</td>
                            <td>R$ ${parseFloat(i.subtotal).toFixed(2)}</td>
                        </tr>
                    `;
                });

                new bootstrap.Modal(document.getElementById("modalItens")).show();
            } catch (err) {
                alert("Erro ao buscar itens.");
            }
        }

        // Abrir Modal de Status
        function abrirModalStatus(pedidoId, statusAtual) {
            document.getElementById("pedidoIdStatus").value = pedidoId;
            document.getElementById("selectNovoStatus").value = statusAtual;
            new bootstrap.Modal(document.getElementById("modalStatus")).show();
        }

        // Salvar Novo Status
        async function salvarNovoStatus() {
            const pedidoId = document.getElementById("pedidoIdStatus").value;
            const novoStatus = document.getElementById("selectNovoStatus").value;

            try {
                const res = await fetch(`${API_URL}/pedidos/${pedidoId}/status`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ novo_status: novoStatus })
                });

                const data = await res.json();
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById("modalStatus")).hide();
                    carregarPedidos();
                } else {
                    alert(data.detail || "Erro ao atualizar status.");
                }
            } catch (err) {
                alert("Erro na requisição.");
            }
        }

// Ver Histórico de Status
        async function verHistorico(pedidoId) {
            try {
                const res = await fetch(`${API_URL}/pedidos/${pedidoId}/historico`);
                const historico = await res.json();
                const lista = document.getElementById("listaHistorico");
                lista.innerHTML = "";

                if (!historico || !Array.isArray(historico) || historico.length === 0) {
                    lista.innerHTML = '<li class="list-group-item text-muted text-center">Nenhuma alteração de status registrada até o momento.</li>';
                } else {
                    historico.forEach(h => {
                        lista.innerHTML += `
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <small class="text-muted"><i class="bi bi-calendar3"></i> ${h.data_formatada}</small><br>
                                    <span class="badge bg-secondary">${h.status_anterior}</span> 
                                    &rarr; 
                                    <span class="badge bg-primary">${h.status_novo}</span>
                                </div>
                            </li>
                        `;
                    });
                }

                new bootstrap.Modal(document.getElementById("modalHistorico")).show();
            } catch (err) {
                console.error("Erro ao carregar histórico:", err);
                alert("Erro ao carregar histórico.");
            }
        }
        
     function exportarCSV() {
            const tabela = document.getElementById("tabelaPedidos").closest("table");
            const linhas = tabela.querySelectorAll("tr");
            
            if (linhas.length <= 1) {
                alert("Não há pedidos na tabela para exportar.");
                return;
            }

            let csv = [];
            csv.push("ID;Numero Pedido;Otica;Data;Valor Total;Status");

            for (let i = 1; i < linhas.length; i++) {
                const colunas = linhas[i].querySelectorAll("td");
                if (colunas.length >= 6) {
                    const dadosLinha = [
                        colunas[0].innerText.trim(),
                        colunas[1].innerText.trim(),
                        colunas[2].innerText.trim(),
                        colunas[3].innerText.trim(),
                        colunas[4].innerText.trim().replace("R$", "").trim(),
                        colunas[5].innerText.trim()
                    ];
                    csv.push(dadosLinha.join(";"));
                }
            }

            const csvString = "\uFEFF" + csv.join("\n");
            const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.href = url;
            link.setAttribute("download", `relatorio_pedidos_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
