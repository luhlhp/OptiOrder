_<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiOrder - Histórico de Pedidos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        .btn-voltar { background-color: #6c757d; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; display: inline-block; margin-bottom: 20px; }
        .btn-detalhes { background-color: #17a2b8; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        
        /* Modal de Detalhes */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 80%; max-width: 600px; }
        .btn-fechar { background-color: #dc3545; color: white; border: none; padding: 6px 12px; cursor: pointer; float: right; }
    </style>
</head>
<body>

<div class="container">
    <a href="dashboard.html" class="btn-voltar">← Ir para o Menu</a>
    <h1>Histórico de Pedidos Realizados</h1>

    <table>
        <thead>
            <tr>
                <th>Nº do Pedido</th>
                <th>Ótica</th>
                <th>Data / Hora</th>
                <th>Qtd. Itens</th>
                <th>Valor Total</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaPedidos">
            <tr>
                <td colspan="6" style="text-align: center;">Carregando pedidos...</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- MODAL PARA VER ITENS DO PEDIDO -->
<div id="modalItens" class="modal">
    <div class="modal-content">
        <button class="btn-fechar" onclick="fecharModal()">X</button>
        <h2 id="tituloModal">Detalhes do Pedido</h2>
        <table>
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Preço Un.</th>
                    <th>Qtd</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody id="tabelaItensPedido"></tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:8000";

    window.onload = carregarPedidos;

    async function carregarPedidos() {
        try {
            const res = await fetch(`${API_URL}/pedidos`);
            const pedidos = await res.json();
            const tbody = document.getElementById('tabelaPedidos');
            tbody.innerHTML = '';

            if (pedidos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Nenhum pedido registrado até o momento.</td></tr>';
                return;
            }

            pedidos.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${p.numero_pedido}</strong></td>
                        <td>${p.otica_nome}</td>
                        <td>${p.data_formatada}</td>
                        <td>${p.quantidade_total}</td>
                        <td>R$ ${parseFloat(p.valor_total).toFixed(2)}</td>
                        <td>
                            <button class="btn-detalhes" onclick="verDetalhes(${p.id}, '${p.numero_pedido}')">Ver Itens</button>
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error(err);
            alert("Erro ao carregar lista de pedidos.");
        }
    }

    async function verDetalhes(pedidoId, numeroPedido) {
        try {
            const res = await fetch(`${API_URL}/pedidos/${pedidoId}/itens`);
            const itens = await res.json();
            
            document.getElementById('tituloModal').innerText = `Itens do Pedido: ${numeroPedido}`;
            const tbody = document.getElementById('tabelaItensPedido');
            tbody.innerHTML = '';

            itens.forEach(i => {
                tbody.innerHTML += `
                    <tr>
                        <td>${i.modelo} (${i.marca})</td>
                        <td>R$ ${parseFloat(i.preco_unitario).toFixed(2)}</td>
                        <td>${i.quantidade}</td>
                        <td>R$ ${parseFloat(i.subtotal).toFixed(2)}</td>
                    </tr>
                `;
            });

            document.getElementById('modalItens').style.display = 'flex';
        } catch (err) {
            console.error(err);
            alert("Erro ao buscar detalhes do pedido.");
        }
    }

    function fecharModal() {
        document.getElementById('modalItens').style.display = 'none';
    }
</script>

</body>
</html>
